<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2lab/ui — Agent UI components</title>
    <meta name="description" content="Agent UI Web Components from the 2lab soma-work dashboard: Agent Run, Agent Inbox, Agent Tree, AI Answer, Tool Call Card, Agent Queue, Context Window, Memory Panel, Model Picker — plus primitives (Segmented, Tabs, Menu, Tooltip, Hovercard, Dialog, Drawer, Disclosure), an icon set and a CSS kit." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('2lab-ui-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

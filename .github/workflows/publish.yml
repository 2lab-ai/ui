name: Publish
# A v* tag publishes @2lab.ai/ui to npmjs (public) after the full gate. Secret NPM_TOKEN: npm automation/granular token of z-2lab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Version not published yet
        run: |
          v="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$v" version >/dev/null 2>&1; then echo "$v is already on npm"; exit 1; fi
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run consumer-check
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
